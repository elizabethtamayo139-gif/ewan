<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us GARNET_TUTORIAL</title>

<style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
            color: #333;
        }

        /* HEADER */
        header {
            background-color: #2563eb;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        /* NAVIGATION */
        nav {
            background-color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 15px;
            gap: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            background-color: #2563eb;
            color: white;
        }

        /* MAIN CONTENT */
        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .contact-card {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .contact-card h2 {
            color: #2563eb;
            margin-top: 0;
        }

        /* CONTACT INFORMATION */
        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin: 20px 0;
            padding: 15px;
            background-color: #f1f5f9;
            border-radius: 8px;
        }

        .icon {
            font-size: 22px;
        }

        .label {
            display: block;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 5px;
        }

        .info-text {
            display: block;
        }

        /* FORM */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* FOOTER */
        footer {
            background-color: #1e293b;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
            }

            nav a {
                width: 100%;
                text-align: center;
            }

            .container {
                width: 92%;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>GARNET TUTORIAL</h1>
        <p>HTML Tutorial for Beginners</p>
    </header>

    <!-- NAVIGATION -->
    <nav>
        <a href="index.html">Home</a>
        <a href="contact Us.html">Contact Us</a>
    </nav>
	
	<h1>📬 Contact Us 📬</h1>

    <!-- Contact Info -->
    <div class="contact-card">
        <h2>📍 Get In Touch 📍</h2>

        <div class="info-row">
            <span class="icon">🖥️</span>
            <div>
                <span class="label">Address</span>
                <span class="info-text">Brgy Don Bosco, Parañaque, Metro Manila, Philippines</span>
            </div>
        </div>

        <div class="info-row">
            <span class="icon">📞</span>
            <div>
                <span class="label">Phone</span>
                <span class="info-text">+63 906 440 8979</span>
            </div>
        </div>

        <div class="info-row">
            <span class="icon">✉️</span>
            <div>
                <span class="label">Email</span>
                <span class="info-text">info@GARNET_TUTORIAL.ph</span>
            </div>
        </div>
    </div>

    <!-- Contact Form -->
    <div class="contact-card">
        <h2>✉️ Send Us a Message 💌</h2>
        <form>
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="example@email.com">
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="How can we help you?">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message here..."></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </div>

</body>
</html>
